<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟花</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
  }
  canvas { display: block; }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: 2px;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 12px rgba(120,180,255,0.6);
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hint">点击任意位置 / 自动绽放</div>
<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const rand = (min, max) => Math.random() * (max - min) + min;
const TAU = Math.PI * 2;

class Particle {
  constructor(x, y, hue, opts = {}) {
    this.x = x;
    this.y = y;
    this.hue = hue;
    const speed = opts.speed ?? rand(1, 6);
    const angle = opts.angle ?? rand(0, TAU);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.gravity = opts.gravity ?? 0.045;
    this.friction = opts.friction ?? 0.985;
    this.life = 1;
    this.decay = opts.decay ?? rand(0.008, 0.02);
    this.size = opts.size ?? rand(1, 2.6);
    this.trail = [];
    this.trailLen = opts.trailLen ?? 4;
    this.sparkle = opts.sparkle ?? false;
  }
  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.trailLen) this.trail.shift();
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    const a = Math.max(this.life, 0);
    const light = this.sparkle ? 70 + Math.sin(this.life * 60) * 25 : 60;
    ctx.strokeStyle = `hsla(${this.hue}, 100%, ${light}%, ${a})`;
    ctx.lineWidth = this.size;
    ctx.lineCap = 'round';
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, TAU);
      ctx.fillStyle = `hsla(${this.hue}, 100%, ${light}%, ${a})`;
      ctx.fill();
    }
  }
}

class Rocket {
  constructor(targetX, targetY, hue) {
    this.x = targetX + rand(-30, 30);
    this.y = H + 10;
    this.targetX = targetX;
    this.targetY = targetY;
    this.hue = hue;
    this.speed = rand(11, 15);
    this.angle = Math.atan2(targetY - this.y, targetX - this.x);
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.trail = [];
    this.done = false;
  }
  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    if (this.y <= this.targetY) this.done = true;
  }
  draw() {
    ctx.strokeStyle = `hsla(${this.hue}, 100%, 75%, 0.9)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (this.trail.length) {
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (const p of this.trail) ctx.lineTo(p.x, p.y);
    }
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2.2, 0, TAU);
    ctx.fillStyle = `hsl(${this.hue}, 100%, 90%)`;
    ctx.fill();
  }
}

const rockets = [];
const particles = [];

const PALETTES = [
  [0, 40], [280, 340], [180, 220], [90, 140], [0, 360]
];

function explode(x, y, hue) {
  const type = Math.random();
  const count = 90 + Math.floor(Math.random() * 70);

  if (type < 0.5) {
    // 球形
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, hue + rand(-20, 20), {
        speed: Math.pow(Math.random(), 0.6) * 7,
        decay: rand(0.008, 0.018),
        size: rand(1.2, 2.8),
        trailLen: 5
      }));
    }
  } else if (type < 0.8) {
    // 双色环
    const hue2 = (hue + 140) % 360;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU + rand(-0.02, 0.02);
      const sp = rand(4.5, 6.5);
      particles.push(new Particle(x, y, i % 2 ? hue : hue2, {
        speed: sp, angle: a, decay: rand(0.01, 0.02), size: rand(1.4, 2.6), trailLen: 6
      }));
    }
  } else {
    // 柳枝拖尾
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      particles.push(new Particle(x, y, hue + rand(-15, 15), {
        speed: rand(2, 5), angle: a, gravity: 0.09,
        decay: rand(0.004, 0.01), size: rand(1.5, 3), trailLen: 10, sparkle: true
      }));
    }
  }

  // 中心闪光
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, 50, {
      speed: rand(0, 2), decay: 0.06, size: rand(1, 2), trailLen: 2
    }));
  }
}

function launch(x, y) {
  const px = x ?? rand(W * 0.15, W * 0.85);
  const py = y ?? rand(H * 0.12, H * 0.45);
  const hue = rand(0, 360);
  rockets.push(new Rocket(px, py, hue));
}

let autoTimer = 0;
function loop() {
  // 拖尾残影
  ctx.fillStyle = 'rgba(9, 10, 15, 0.22)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.update();
    r.draw();
    if (r.done) {
      explode(r.x, r.y, r.hue);
      rockets.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();
    if (p.life <= 0) particles.splice(i, 1);
  }

  ctx.globalCompositeOperation = 'source-over';

  autoTimer--;
  if (autoTimer <= 0) {
    launch();
    autoTimer = rand(25, 70);
  }

  requestAnimationFrame(loop);
}

window.addEventListener('pointerdown', (e) => launch(e.clientX, e.clientY));
loop();
setTimeout(launch, 300);
setTimeout(launch, 700);
</script>
</body>
</html>
